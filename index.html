<title>Old Norse Dictionary (ᚢ·ᚾ·ᛏ) v2.0</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#140D08;color:#F5E3C6;font-family:Georgia,serif;overflow:hidden}
.bg{position:fixed;inset:0;width:100%;background:url('./bg_norse.jpg') no-repeat center center;background-size:100% 100%;display:flex;flex-direction:column;padding:37vh 36px 46px}
.bg.open{padding-top:11vh}.title{text-align:center;font-size:17px;font-weight:bold;letter-spacing:1.2px;color:#FFF5E0;text-shadow:0 2px 6px #000;margin-bottom:8px;flex-shrink:0}
.srow{display:flex;gap:6px;margin-bottom:6px;flex-shrink:0}
.sbox{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid #8A6236;background:rgba(20,12,7,.92);color:#FFF8EA;font-size:15px;font-family:sans-serif;outline:none}
.hbtn{flex-shrink:0;padding:0 12px;border-radius:10px;border:1.5px solid #8A6236;background:#3A2515;color:#F5E3C6;font-weight:bold;font-size:13px;cursor:pointer;display:none}
.cbar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:6px;flex-shrink:0}
.cbtn{background:rgba(48,30,17,.94);color:#F5E3C6;border:1px solid #7A542E;border-radius:6px;padding:4px 7px;font-size:13px;font-weight:bold;cursor:pointer}

.agrid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:100%;margin-bottom:8px;flex-shrink:0}
.abtn{width:calc(11.11% - 4px);background:rgba(28,17,10,.9);border:1.2px solid #6E4A26;border-radius:9px;padding:7px 0;color:#FFF4DC;font-size:13px;font-weight:bold;font-family:Georgia,serif;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.abtn:active,.cbtn:active,.hbtn:active{background:#633F22}
.panel{flex:1;width:100%;background:rgba(18,11,6,.94);border:1.5px solid #7A542E;border-radius:12px;padding:12px;overflow-y:auto;overflow-x:hidden;display:none;margin-bottom:6px}
.item{padding:9px 6px;border-bottom:1px solid rgba(138,98,54,.35);cursor:pointer}
.ihw{font-size:17px;font-weight:bold;color:#F5B82E}
.imeta{font-size:12px;color:#D8BE96;font-family:sans-serif}
.dhw{font-size:23px;font-weight:bold;color:#F5B82E;display:flex;justify-content:space-between;align-items:center;gap:8px}.rbtn{padding:4px 12px;font-size:16px;line-height:1;border-radius:8px;border:1.2px solid #8A6236;background:#3A2515;color:#F5E3C6;font-weight:bold;font-size:12px;font-family:sans-serif;cursor:pointer;flex-shrink:0}.rbtn:active{background:#633F22}
.drune{font-size:17px;color:#E0B256;margin:3px 0 6px}
.sec{font-size:11px;font-weight:bold;letter-spacing:.7px;color:#F5B82E;font-family:sans-serif;margin:11px 0 4px;border-bottom:1px solid rgba(245,184,46,.3);padding-bottom:2px}
.prep{background:rgba(42,72,38,.5);border:1px solid #6DA865;border-radius:8px;padding:8px 10px;font-size:13px;color:#CCFFCA;font-family:sans-serif}
table{width:100%;border-collapse:collapse;font-size:9px;margin-top:4px;font-family:sans-serif}th,td{border:1px solid rgba(138,98,54,.45);padding:2.5px 1.5px;text-align:left}
th{color:#F5B82E;background:rgba(58,37,21,.65)}
.def{font-size:13.5px;line-height:1.45;color:#F5E8D0;white-space:pre-wrap}
.foot{text-align:center;font-size:11.5px;color:#F5E3C6;text-shadow:0 2px 5px #000;line-height:1.35;flex-shrink:0;padding-top:4px}
.gbtn{color:#F5B82E;border-color:#A8793E}.warn{background:rgba(92,38,24,.6);border:1px solid #D97459;border-radius:8px;padding:8px 10px;font-size:13px;color:#FFD6CC;font-family:sans-serif;margin-bottom:5px}.garea{width:100%;min-height:74px;padding:9px;border-radius:8px;border:1.2px solid #8A6236;background:rgba(28,17,10,.95);color:#FFF8EA;font-size:14.5px;font-family:Georgia,serif;outline:none;resize:vertical;margin-bottom:6px}.gact{width:100%;padding:9px;border-radius:8px;border:1.2px solid #A8793E;background:#4A2F19;color:#F5B82E;font-weight:bold;font-size:13.5px;font-family:sans-serif;cursor:pointer;margin-bottom:8px}.wcard{padding:7px 8px;border:1px solid rgba(138,98,54,.4);border-radius:8px;margin-bottom:5px;background:rgba(28,17,10,.7);cursor:pointer}</style><script src="./sql-wasm.js"></script></head><body><div class="bg" id="bg">
<div class="title">OLD NORSE DICTIONARY</div>
<div class="srow"><button id="hb" class="hbtn" onclick="goHome()">Home</button><input id="q" class="sbox" type="text" placeholder="Search Old Norse, inflected, or English..." disabled oninput="doSearch()"><button id="gb" class="hbtn gbtn" style="display:inline-block" onclick="openGrammar()">Grammar</button></div>

<div class="stat" id="st">Loading 111,488 entries...</div>
<div class="agrid" id="ag"></div>
<div class="panel" id="pnl"></div>
<div class="foot">Sources: Cleasby &amp; Vigfússon • Zoëga • ONP • Wiktionary<br>(CC BY-SA 4.0)<br>Version 2.0</div>
</div><script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
const YF={a:'ᛅ',á:'ᛅ',b:'ᛒ',c:'ᚴ',d:'ᛏ',ð:'ᚦ',e:'ᛁ',é:'ᛁ',f:'ᚠ',g:'ᚴ',h:'ᚼ',i:'ᛁ',í:'ᛁ',j:'ᛁ',k:'ᚴ',l:'ᛚ',m:'ᛘ',n:'ᚾ',o:'ᚢ',ó:'ᚢ',p:'ᛒ',q:'ᚴ',r:'ᚱ',s:'ᛋ',t:'ᛏ',u:'ᚢ',ú:'ᚢ',v:'ᚢ',w:'ᚢ',x:'ᚴᛋ',y:'ᚢ',ý:'ᚢ',z:'ᛋ',þ:'ᚦ',æ:'ᛅ',ǽ:'ᛅ',ø:'ᚢ',ǫ:'ᚢ',œ:'ᚢ',ö:'ᚢ'};
function toRunes(s){let o=[];for(let c of s.toLowerCase()){if(YF[c]){let r=YF[c];if(o[o.length-1]!==r)o.push(r)}else if(c===' '||c==='-')o.push('·')}return o.join('')}
function norm(t){t=t.toLowerCase().trim();const m={ð:'d',þ:'th',æ:'ae',ǽ:'aee',œ:'oe',ø:'o',ǫ:'o',ö:'o',á:'a',é:'e',í:'i',ó:'o',ú:'u',ý:'y'};return t.replace(/[ðþæǽœøǫöáéíóúý]/g,c=>m[c]||c).normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function rows(res){return(res&&res.length)?res.at(0).values:[]}
["á","ð","é","í","ó","ú","ý","þ","æ","ø","ǫ","œ"].forEach(c=>{let b=document.createElement("button");b.className="cbtn";b.textContent=c;b.onclick=()=>{let i=document.getElementById("q");i.value+=c;i.focus();doSearch()};void 0});
[..."AÁBDÐEÉFGHIÍJKLMNOÓPRSTUÚVYÝÞÆǼØǪŒ"].forEach(l=>{let b=document.createElement("button");b.className="abtn";b.textContent=l;b.onclick=()=>browseLetter(l);document.getElementById("ag").appendChild(b)});
let db=null,lastMode="list",lastList=[],lastScroll=0,lastSent="";(async()=>{try{const S=await initSqlJs({locateFile:f=>`./${f}`});const r=await fetch("./old_norse.db.gz");const buf=await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();db=new S.Database(new Uint8Array(buf));document.getElementById("st").textContent="111,488 Headwords Ready • 100% Offline";document.getElementById("q").disabled=false;document.getElementById("gb").disabled=false}catch(e){document.getElementById("st").textContent="Error: "+e.message}})();
function goHome(){document.getElementById("bg").classList.remove("open");document.getElementById("pnl").style.display="none";document.getElementById("ag").style.display="flex";document.getElementById("hb").style.display="none";document.getElementById("q").value="";document.getElementById("st").textContent="111,488 Headwords Ready • 100% Offline"}
function browseLetter(l){if(!db)return;const w=l.toLowerCase(),u=l.toUpperCase(),it=rows(db.exec("SELECT id,headword,pos,gender FROM lemmas WHERE headword LIKE ? OR headword LIKE ? OR headword LIKE ? OR headword LIKE ? ORDER BY sort_key ASC LIMIT 300",[w+"%",u+"%","-"+w+"%","-"+u+"%"])).map(x=>({id:x.at(0),hw:x.at(1),pos:x.at(2),g:x.at(3)}));document.getElementById("st").textContent=`Letter ${l} (${it.length} shown)`;renderList(it)}
function doSearch(){if(!db)return;const raw=document.getElementById("q").value.trim();if(!raw){goHome();return}const low=raw.toLowerCase(),up=raw.toUpperCase();let s=new Set(),it=[];
rows(db.exec("SELECT id,headword,pos,gender FROM lemmas WHERE headword LIKE ? OR headword LIKE ? ORDER BY length(headword) ASC,sort_key ASC LIMIT 80",[low+"%",up+"%"])).forEach(x=>{if(!s.has(x.at(0))){s.add(x.at(0));it.push({id:x.at(0),hw:x.at(1),pos:x.at(2),g:x.at(3)})}});
rows(db.exec("SELECT DISTINCT l.id,l.headword,l.pos,l.gender,w.form FROM wordforms w JOIN lemmas l ON l.id=w.lemma_id WHERE w.form LIKE ? OR w.form LIKE ? LIMIT 50",[low+"%",up+"%"])).forEach(x=>{if(!s.has(x.at(0))){s.add(x.at(0));it.push({id:x.at(0),hw:x.at(1),pos:x.at(2),g:x.at(3),inf:x.at(4)})}});
if(it.length<5&&low.length>=3&&!/[áéíóúýæǽøǫœðþ]/i.test(low)){const rx=new RegExp("\\b"+low.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");rows(db.exec("SELECT id,headword,pos,gender,zoega_def,cleasby_def,wikt_def FROM lemmas WHERE lower(zoega_def) LIKE ? OR lower(cleasby_def) LIKE ? OR lower(wikt_def) LIKE ? LIMIT 80",["%"+low+"%","%"+low+"%","%"+low+"%"])).forEach(x=>{if(!s.has(x.at(0))&&rx.test((x.at(4)||"")+" "+(x.at(5)||"")+" "+(x.at(6)||""))){s.add(x.at(0));it.push({id:x.at(0),hw:x.at(1),pos:x.at(2),g:x.at(3),eng:1})}})}
document.getElementById("st").textContent=`${it.length} matches for "${raw}"`;renderList(it)}
function goBack(){if(lastMode==="grammar"){openGrammar(lastSent,true)}else{renderList(lastList);document.getElementById("pnl").scrollTop=lastScroll}}function renderList(it){lastMode="list";lastList=it;document.getElementById("bg").classList.add("open");document.getElementById("ag").style.display="none";document.getElementById("hb").style.display="inline-block";const p=document.getElementById("pnl");p.style.display="block";p.scrollTop=0;p.innerHTML=it.length?"":"<div class='imeta'>No matching entries found.</div>";it.forEach(x=>{let d=document.createElement("div");d.className="item";let tag=(x.g||x.pos)?` (${x.g||x.pos})`:"";let via=x.inf?` ← ${x.inf}`:(x.eng?" [English match]":"");d.innerHTML=`<div class="ihw">${x.hw} <span class="imeta">${tag}${via}</span></div>`;d.onclick=()=>showDetail(x.id,x.inf);p.appendChild(d)})}
function showDetail(id,inf){if(lastMode==="list")lastScroll=document.getElementById("pnl").scrollTop;document.getElementById("q").blur();const r=rows(db.exec("SELECT headword,pos,gender,zoega_def,cleasby_def,onp_def,wikt_def,prep_cases FROM lemmas WHERE id=?",[id]));if(!r.length)return;const[hw,pos,g,zg,cl,onp,wk,pc]=r.at(0);let gr={};rows(db.exec("SELECT case_name,number,definiteness,form FROM wordforms WHERE lemma_id=?",[id])).forEach(x=>gr[`${x.at(0)}_${x.at(1)}_${x.at(2)}`]=x.at(3));
let h=`<div class="dhw"><span>${hw} <span class="imeta">${[pos,g].filter(Boolean).join(" • ")}</span></span><button class="rbtn" onclick="goBack()" aria-label="Back to results">←</button></div><div class="drune">Younger Futhark: ${toRunes(hw)}</div>`;
if(inf)h+=`<div class="imeta">Matched inflected form: <b>${inf}</b></div>`;
if(pc)h+=`<div class="sec">PREPOSITION CASE GOVERNMENT (STJÓRN)</div><div class="prep">${pc}</div>`;
if(gr.NOM_SG_INDEF){h+=`<div class="sec">4-CASE DECLENSION TABLE</div><div style="overflow-x:auto;width:100%"><table><tr><th>Case</th><th>Sg Indef</th><th>Sg Def</th><th>Pl Indef</th><th>Pl Def</th></tr>`;["NOM","ACC","DAT","GEN"].forEach(c=>h+=`<tr><th>${c}</th><td>${gr[c+"_SG_INDEF"]||"-"}</td><td>${gr[c+"_SG_DEF"]||"-"}</td><td>${gr[c+"_PL_INDEF"]||"-"}</td><td>${gr[c+"_PL_DEF"]||"-"}</td></tr>`);h+=`</table></div>`}
if(gr.PRES_1SG_VERB){h+=`<div class="sec">VERB CONJUGATION TABLE</div><div style="overflow-x:auto;width:100%"><table><tr><th>Person</th><th>Present</th><th>Past</th></tr>`;[["1sg (ek)","1SG"],["2sg (þú)","2SG"],["3sg (hann/hún)","3SG"],["1pl (vér)","1PL"],["2pl (þér)","2PL"],["3pl (þeir)","3PL"]].forEach(([l,k])=>h+=`<tr><th>${l}</th><td>${gr["PRES_"+k+"_VERB"]||"-"}</td><td>${gr["PAST_"+k+"_VERB"]||"-"}</td></tr>`);if(gr.PART_PP_VERB)h+=`<tr><th>Past Part.</th><td colspan="2">${gr.PART_PP_VERB}</td></tr>`;h+=`</table></div>`}
[["ZOËGA (1910)",zg],["CLEASBY & VIGFÚSSON (1874)",cl],["ONP — UNIV. OF COPENHAGEN (CC BY-SA 4.0)",onp],["WIKTIONARY (CC BY-SA 4.0)",wk]].forEach(([t,tx])=>{if(tx&&tx.trim())h+=`<div class="sec">${t}</div><div class="def">${tx.trim()}</div>`});
const p=document.getElementById("pnl");p.innerHTML=h;p.scrollTop=0}

const PREPS={til:["GEN"],frá:["DAT"],af:["DAT"],at:["DAT"],ór:["DAT"],úr:["DAT"],hjá:["DAT"],mót:["DAT"],móti:["DAT"],um:["ACC"],gegnum:["ACC"],umhverfis:["ACC"],án:["GEN"],auk:["GEN"],milli:["GEN"],millum:["GEN"],á:["ACC","DAT"],í:["ACC","DAT"],með:["ACC","DAT"],við:["ACC","DAT"],fyrir:["ACC","DAT"],undir:["ACC","DAT"],yfir:["ACC","DAT"],eptir:["ACC","DAT"],eftir:["ACC","DAT"]};
const PRON={ek:"1SG",eg:"1SG",þú:"2SG",hann:"3SG",hún:"3SG",þat:"3SG",vér:"1PL",þér:"2PL",þeir:"3PL",þær:"3PL",þau:"3PL"};
function openGrammar(prefill,auto){lastMode="grammar";document.getElementById("bg").classList.add("open");document.getElementById("ag").style.display="none";document.getElementById("hb").style.display="inline-block";document.getElementById("st").textContent="Sentence & Grammar Analyzer (100% Offline)";const p=document.getElementById("pnl");p.style.display="block";p.innerHTML=`<div class="sec" style="margin-top:0">OLD NORSE GRAMMAR &amp; STJÓRN CHECKER</div><textarea id="gs" class="garea" placeholder="Enter an Old Norse sentence (e.g., ek fer til konungs, or test a mismatch like: hann gengr frá konungr)...">${prefill||""}</textarea><button class="gact" onclick="runGrammar()">Analyze Grammar &amp; Case Government</button><div id="gout"></div>`;if(auto&&prefill)runGrammar()}
function runGrammar(){if(!db)return;const raw=document.getElementById("gs").value.trim();lastSent=raw;const out=document.getElementById("gout");if(!raw){out.innerHTML="";return}const toks=raw.replace(/[.,!?;:"'()]/g,"").split(/\s+/).filter(Boolean);
let parsed=toks.map(w=>{const low=w.toLowerCase();let wf=rows(db.exec("SELECT l.id,l.headword,l.pos,l.gender,w.case_name,w.number,w.definiteness FROM wordforms w JOIN lemmas l ON l.id=w.lemma_id WHERE lower(w.form)=? LIMIT 12",[low]));let lm=rows(db.exec("SELECT id,headword,pos,gender FROM lemmas WHERE lower(headword)=? LIMIT 4",[low]));return{word:w,low,wf,lm}});
let notes=[];
for(let i=0;i<parsed.length-1;i++){let cur=parsed.at(i),nxt=parsed.at(i+1);
if(PREPS[cur.low]&&nxt.wf.length){let req=PREPS[cur.low];let nounForms=nxt.wf.filter(x=>["NOM","ACC","DAT","GEN"].includes(x.at(4)));if(nounForms.length){let ok=nounForms.some(x=>req.includes(x.at(4)));if(ok){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: Valid <i>Stjórn</i> (${req.join("/")})</div>`)}else{let lid=nounForms.at(0).at(0),num=nounForms.at(0).at(5),df=nounForms.at(0).at(6);let fix=rows(db.exec("SELECT form FROM wordforms WHERE lemma_id=? AND case_name=? AND number=? AND definiteness=? LIMIT 1",[lid,req.at(0),num,df]));let sug=fix.length?` \u2192 suggested <b>${req.at(0)}</b>: <b>${fix.at(0).at(0)}</b>`:"";notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${nxt.word}</b>: Preposition <i>${cur.low}</i> governs <b>${req.join(" or ")}</b>, found ${nounForms.at(0).at(4)}${sug}</div>`)}}}
if(PRON[cur.low]&&nxt.wf.length){let reqP=PRON[cur.low];let vForms=nxt.wf.filter(x=>x.at(6)==="VERB"&&x.at(5));if(vForms.length){let okV=vForms.some(x=>x.at(5)===reqP);if(okV){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: Subject-verb agreement matches (${reqP})</div>`)}else{let lid=vForms.at(0).at(0),tense=vForms.at(0).at(4);let fixV=rows(db.exec("SELECT form FROM wordforms WHERE lemma_id=? AND case_name=? AND number=? AND definiteness='VERB' LIMIT 1",[lid,tense,reqP]));let sugV=fixV.length?` \u2192 expected <b>${reqP}</b>: <b>${fixV.at(0).at(0)}</b>`:"";notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${nxt.word}</b>: Pronoun <i>${cur.low}</i> requires <b>${reqP}</b> verb, found ${vForms.at(0).at(5)}${sugV}</div>`)}}}}
let h=notes.length?`<div class="sec">GRAMMAR &amp; CASE CHECKS</div>${notes.join("")}`:`<div class="sec">GRAMMAR &amp; CASE CHECKS</div><div class="prep">No preposition-case or pronoun-verb mismatches detected.</div>`;
h+=`<div class="sec">WORD-BY-WORD MORPHOLOGICAL GLOSS (TAP ANY WORD)</div>`;
parsed.forEach(p=>{let id=p.wf.length?p.wf.at(0).at(0):(p.lm.length?p.lm.at(0).at(0):null);let hw=p.wf.length?p.wf.at(0).at(1):(p.lm.length?p.lm.at(0).at(1):"Unknown");let tags=p.wf.length?[...new Set(p.wf.map(x=>`${x.at(4)} ${x.at(5)} ${x.at(6)}`.replace("VERB","").trim()))].slice(0,3).join(" / "):(p.lm.length?(p.lm.at(0).at(2)||"headword"):"not in lexicon");h+=`<div class="wcard" ${id?`onclick="showDetail(${id},'${p.word.replace(/'/g,"\'")}')"` :""}><div class="ihw">${p.word} <span class="imeta">\u2192 ${hw} (${tags})</span></div><div class="imeta" style="color:#D9A84E">Runes: ${toRunes(p.word)}</div></div>`});
out.innerHTML=h}
</script></body></html>
