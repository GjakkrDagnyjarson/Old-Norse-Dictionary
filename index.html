    [/ir$/,"r","NOM/ACC PL"],[/ir$/,"","NOM/ACC PL"],
    [/a$/,"i","OBL SG / GEN PL"],[/a$/,"","GEN PL"],[/i$/,"r","DAT SG"],[/i$/,"","DAT SG"],[/s$/,"r","GEN SG"],[/s$/,"","GEN SG"]
  ];
  for(const [rx,rep,tag] of irules){
    if(rx.test(l)){
      const cand=l.replace(rx,rep);
      if(cand.length>=2){
        let res=db.exec("SELECT id,headword,pos,gender FROM lemmas WHERE lower(headword)=? LIMIT 4",[cand]);
        if(res.length){
          lm=res.at(0).values;
          enc=enc?enc+" • "+tag:tag;
          break;
        }
      }
    }
  }
}
return{word:w,low,wf,lm,enc}}

function runGrammar(){if(!db)return;const raw=document.getElementById("gs").value.trim();lastSent=raw;const out=document.getElementById("gout");if(!raw){out.innerHTML="";return}const toks=raw.replace(/[.,!?;:"'()]/g,"").split(/\s+/).filter(Boolean);
let parsed=toks.map(lookupWord);
let notes=[];
for(let i=0;i<parsed.length-1;i++){let cur=parsed.at(i),nxt=parsed.at(i+1);
const V_GOV={krefja:"GEN",leita:"GEN",njóta:"GEN",bíða:"GEN",sakna:"GEN",gæta:"GEN",minnast:"GEN",geta:"GEN",vitja:"GEN",biðja:"GEN",mæta:"DAT",hjálpa:"DAT",fylgja:"DAT",svara:"DAT",þakka:"DAT",stjórna:"DAT",bregða:"DAT",kasta:"DAT",ríða:"DAT",halda:"DAT",gleyma:"DAT",lofa:"DAT",unna:"DAT"};if(PREPS[cur.low]&&nxt.wf.length){let req=PREPS[cur.low],tgt=nxt;let nounForms=tgt.wf.filter(x=>["NOM","ACC","DAT","GEN"].includes(x.at(4)));if(nounForms.length&&!nounForms.some(x=>req.includes(x.at(4)))&&nounForms.some(x=>x.at(4)==="GEN")&&i+2<parsed.length){let nxt2=parsed.at(i+2),nf2=nxt2.wf.filter(x=>["NOM","ACC","DAT","GEN"].includes(x.at(4)));if(nf2.length){tgt=nxt2;nounForms=nf2}}if(nounForms.length){let ok=nounForms.some(x=>req.includes(x.at(4)))||(req.includes("DAT")&&nounForms.some(x=>String(x.at(3)||"").toLowerCase().startsWith("f")&&String(x.at(1)||"").toLowerCase()===tgt.low&&x.at(4)==="NOM"));if(ok){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${tgt.word}</b>: Valid <i>Stj\u00f3rn</i> (${req.join("/")})</div>`)}else{let lid=nounForms.at(0).at(0),num=nounForms.at(0).at(5),df=nounForms.at(0).at(6);let fix=rows(db.exec("SELECT form FROM wordforms WHERE lemma_id=? AND case_name=? AND number=? AND definiteness=? LIMIT 1",[lid,req.at(0),num,df]));let sug=fix.length?` \u2192 suggested <b>${req.at(0)}: ${fix.at(0).at(0)}</b>`:"";notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${tgt.word}</b>: Preposition <i>${cur.low}</i> governs <b>${req.join(" or ")}</b>, found <b>${nounForms.at(0).at(4)}</b>${sug}</div>`)}}}
let reqPs=PRON[cur.low]?[PRON[cur.low]]:[];if(!reqPs.length&&!PREPS[cur.low]&&!(i>0&&PREPS[parsed.at(i-1).low])){if(cur.wf.some(x=>x.at(4)==="NOM"&&x.at(5)==="SG"))reqPs.push("3SG");if(cur.wf.some(x=>x.at(4)==="NOM"&&x.at(5)==="PL"))reqPs.push("3PL")}
if(reqPs.length&&nxt.wf.length){let vForms=nxt.wf.filter(x=>x.at(6)==="VERB"&&x.at(5));if(vForms.length){let okV=vForms.some(x=>reqPs.includes(x.at(5)));let reqP=okV?vForms.find(x=>reqPs.includes(x.at(5))).at(5):reqPs.at(0);if(okV){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: Subject-verb agreement matches (${reqP})</div>`)}else if(cur.low==="vera"&&vForms.some(x=>x.at(6)==="PRESP")){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: Valid copula + present participle (periphrastic progressive)</div>`);}else{let lid=vForms.at(0).at(0),tense=vForms.at(0).at(4);let fixV=rows(db.exec("SELECT form FROM wordforms WHERE lemma_id=? AND case_name=? AND number=? AND definiteness='' LIMIT 1",[lid,tense,reqP]));let sugV=fixV.length?` \u2192 expected <b>${reqP}: ${fixV.at(0).at(0)}</b>`:"";notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${nxt.word}</b>: Subject <i>${cur.word}</i> requires <b>${reqP}</b> verb, found <b>${vForms.at(0).at(5)}</b>${sugV}</div>`)}}}let curV=cur.wf.filter(x=>x.at(6)==="VERB"&&x.at(5));if(curV.length&&nxt.wf.length){let nxtSubj=nxt.wf.filter(x=>x.at(4)==="NOM"&&(x.at(5)==="SG"||x.at(5)==="PL")&&!PREPS[nxt.low]);let pReq=PRON[nxt.low];if(pReq||nxtSubj.length){let sReqs=pReq?[pReq]:Array.from(new Set(nxtSubj.map(x=>x.at(5)==="SG"?"3SG":"3PL")));let okInv=curV.some(x=>sReqs.includes(x.at(5)));if(okInv){let mp=curV.find(x=>sReqs.includes(x.at(5))).at(5);notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: V2 inverted verb-subject agreement matches (${mp})</div>`)}else{notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${nxt.word}</b>: Verb <i>${cur.word}</i> (${curV.at(0).at(5)}) disagrees with subject <i>${nxt.word}</i> (expected ${sReqs.join("/")})</div>`)}}let vLem=String(curV.at(0).at(1)||"").toLowerCase(),govC=V_GOV[vLem];let objN=nxt.wf.filter(x=>["NOM","ACC","DAT","GEN"].includes(x.at(4))&&!PRON[nxt.low]);if(govC&&objN.length){if(objN.some(x=>x.at(4)===govC)){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: Valid verb <i>Stj\u00f3rn</i> (${vLem} + ${govC})</div>`)}else{notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${nxt.word}</b>: Verb <i>${vLem}</i> governs <b>${govC}</b>, found <b>${objN.at(0).at(4)}</b></div>`)}}}let adjF=cur.wf.filter(x=>String(x.at(2)||"").toLowerCase().startsWith("adj")&&["NOM","ACC","DAT","GEN"].includes(x.at(4)));let nounF=nxt.wf.filter(x=>!String(x.at(2)||"").toLowerCase().startsWith("adj")&&["NOM","ACC","DAT","GEN"].includes(x.at(4))&&x.at(3));if(adjF.length&&nounF.length){let agr=adjF.some(a=>nounF.some(n=>a.at(4)===n.at(4)&&(!a.at(5)||!n.at(5)||a.at(5)===n.at(5))&&(!a.at(3)||!n.at(3)||String(a.at(3)).at(0)===String(n.at(3)).at(0))));if(agr){notes.push(`<div class="prep">\u2713 <b>${cur.word} + ${nxt.word}</b>: Adjective-noun gender/number/case agree</div>`)}else{notes.push(`<div class="warn">\u26a0 <b>${cur.word} + ${nxt.word}</b>: Adjective-noun mismatch (<i>${cur.word}</i> vs <i>${nxt.word}</i>)</div>`)}}}
let h=notes.length?`<div class="sec">GRAMMAR &amp; CASE CHECKS</div>${notes.join("")}`:`<div class="sec">GRAMMAR &amp; CASE CHECKS</div><div class="prep">No preposition-case or subject-verb mismatches detected.</div>`;
h+=`<div class="sec">WORD-BY-WORD MORPHOLOGICAL GLOSS (TAP ANY WORD)</div>`;
parsed.forEach(p=>{let id=p.wf.length?p.wf.at(0).at(0):(p.lm.length?p.lm.at(0).at(0):null);let hw=p.wf.length?p.wf.at(0).at(1):(p.lm.length?p.lm.at(0).at(1):"Unknown");let tags=p.wf.length?[...new Set(p.wf.map(x=>`${x.at(4)} ${x.at(5)} ${x.at(6)}`.replace("VERB","").trim()))].slice(0,3).join(" / "):(p.lm.length?(p.lm.at(0).at(2)||"headword"):"not in lexicon");if(p.enc)tags+=(tags?" • ":"")+p.enc;h+=`<div class="wcard" ${id?`onclick="showDetail(${id},'${p.word.replace(/'/g,"\'")}')"` :""}><div class="ihw">${p.word} <span class="imeta">\u2192 ${hw} (${tags})</span></div><div class="imeta" style="color:#D9A84E">Runes: ${toRunes(p.word)}</div></div>`});
out.innerHTML=h}
